[package]
name = "narrative_markets"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
pinocchio = { workspace = true }
pinocchio-system = { workspace = true }
pinocchio-token = { workspace = true }

# On SBF, `find_program_address` is a syscall. Off-chain (host builds and tests)
# it needs the curve25519 implementation, pulled in only for non-Solana targets
# so the deployed binary stays lean.
[target.'cfg(not(target_os = "solana"))'.dependencies]
solana-address = { version = "2.6.1", features = ["curve25519"] }

[dev-dependencies]
litesvm = "0.16.0"
solana-account = "4"
solana-clock = "3"
solana-instruction = "3"
solana-keypair = "3"
solana-message = "4"
solana-signer = "3"
solana-system-interface = { version = "3", features = ["bincode"] }
solana-transaction = { version = "4", features = ["blake3"] }

[features]
default = []
anchor-debug = []
custom-heap = []
custom-panic = []
